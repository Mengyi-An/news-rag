# Every day: fetch RSS news -> append new articles to data/news.jsonl -> commit it.

name: Fetch news

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch:       # also allow a manual run from the Actions tab

permissions:
  contents: write          # needed to push the updated news.jsonl

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch news
        run: python -m src.fetch_news

      - name: Commit the news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.jsonl
          if git diff --cached --quiet; then
            echo "no new articles"
          else
            git commit -m "Fetch news $(date -u +%Y-%m-%d)"
            git push
          fi
